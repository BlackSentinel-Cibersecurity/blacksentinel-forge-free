version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    environment:
      POSTGRES_DB: blacksentinel_forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d blacksentinel_forge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  # ---------------------------------------------------------------------------
  # Redis - Cache & Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forge-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-forge_dev_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-forge_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    image: ghcr.io/blacksentinel-cibersecurity/blacksentinel-forge-free/api-gateway:latest
    container_name: forge-api-gateway
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD:-forge_dev_password}@postgres:5432/blacksentinel_forge
      REDIS_URL: redis://:${REDIS_PASSWORD:-forge_dev_password}@redis:6379
      # From .env beside this file (run scripts/init-env.sh). Left empty, the
      # gateway uses a random secret per run and sign-in stays off.
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "1000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forge-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Workflow Engine
  # ---------------------------------------------------------------------------
  workflow-engine:
    build:
      context: ../../
      dockerfile: services/workflow-engine/Dockerfile
    image: ghcr.io/blacksentinel-cibersecurity/blacksentinel-forge-free/workflow-engine:latest
    container_name: forge-workflow-engine
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD:-forge_dev_password}@postgres:5432/blacksentinel_forge
      REDIS_URL: redis://:${REDIS_PASSWORD:-forge_dev_password}@redis:6379
      MAX_CONCURRENT_EXECUTIONS: "50"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forge-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/blacksentinel-cibersecurity/blacksentinel-forge-free/web:latest
    container_name: forge-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
    depends_on:
      - api-gateway
    networks:
      - forge-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  forge-network:
    driver: bridge
