apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blacksentinel
      component: web
  template:
    metadata:
      labels:
        app: blacksentinel
        component: web
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: blacksentinel/web:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blacksentinel-config
            - secretRef:
                name: blacksentinel-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "/api"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: web
spec:
  type: LoadBalancer
  selector:
    app: blacksentinel
    component: web
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
