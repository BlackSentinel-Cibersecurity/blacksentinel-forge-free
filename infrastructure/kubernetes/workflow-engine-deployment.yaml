apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: workflow-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blacksentinel
      component: workflow-engine
  template:
    metadata:
      labels:
        app: blacksentinel
        component: workflow-engine
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: workflow-engine
          image: blacksentinel/workflow-engine:latest
          ports:
            - containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blacksentinel-config
            - secretRef:
                name: blacksentinel-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8081"
            - name: WORKFLOW_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine-service
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: workflow-engine
spec:
  type: ClusterIP
  selector:
    app: blacksentinel
    component: workflow-engine
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
