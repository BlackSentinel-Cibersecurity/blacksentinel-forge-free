apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blacksentinel
      component: api-gateway
  template:
    metadata:
      labels:
        app: blacksentinel
        component: api-gateway
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: blacksentinel/api-gateway:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blacksentinel-config
            - secretRef:
                name: blacksentinel-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: api-gateway
spec:
  type: ClusterIP
  selector:
    app: blacksentinel
    component: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: api-gateway
data:
  LOG_LEVEL: info
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX: "100"
  CORS_ORIGIN: "*"
