apiVersion: v1
kind: ConfigMap
metadata:
  name: blacksentinel-config
  namespace: blacksentinel-forge
  labels:
    app: blacksentinel
    component: config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_HOST: postgres-service
  DATABASE_PORT: "5432"
  DATABASE_NAME: blacksentinel-forge
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  API_GATEWAY_HOST: api-gateway-service
  API_GATEWAY_PORT: "8080"
  WORKFLOW_ENGINE_HOST: workflow-engine-service
  WORKFLOW_ENGINE_PORT: "8081"
  AI_ENGINE_HOST: ai-engine-service
  AI_ENGINE_PORT: "8082"
  WEB_PORT: "3000"
  CORS_ORIGIN: "*"
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_MAX: "100"
  JWT_EXPIRY: "86400"
  REFRESH_TOKEN_EXPIRY: "604800"
  MAX_UPLOAD_SIZE: "52428800"
  WEBSOCKET_ENABLED: "true"
